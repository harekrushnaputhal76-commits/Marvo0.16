<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marvo AI | Project 0.16</title>
<style>
:root{--bg:#070b14;--panel:#0f1624;--border:#1c2638;--accent:#06b6d4;--accent2:#22d3ee;--text:#eef2f7;--muted:#8b97a8}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,#0b2a3a 0,transparent 60%),var(--bg);color:var(--text);display:flex;overflow:hidden}
button,select,input{background:#16202f;color:var(--text);border:1px solid #2a3750;padding:8px 11px;border-radius:9px;font-size:.88rem;outline:none}
button{cursor:pointer;transition:.15s}
button:hover,select:focus,input:focus{border-color:var(--accent)}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#00141a;font-weight:700;border:none}

/* Sidebar / drawer */
aside{width:250px;background:var(--panel);border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:12px;z-index:30}
.logo{font-weight:800;letter-spacing:.14em;color:var(--accent2);text-shadow:0 0 14px rgba(34,211,238,.45)}
.logo small{color:var(--muted);letter-spacing:0;font-weight:500;margin-left:6px}
aside h4{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.eng{text-align:left;width:100%}
.eng.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;color:var(--accent2)}
.spacer{flex:1}
.stat{font-size:.78rem;color:var(--muted);line-height:1.6}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:rgba(15,22,36,.8);backdrop-filter:blur(6px)}
#burger{display:none}
.badge{background:rgba(6,182,212,.14);color:var(--accent2);border:1px solid var(--accent);padding:2px 9px;border-radius:99px;font-size:.72rem;white-space:nowrap}
header .grow{flex:1}
#chat{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:900px;margin:0 auto}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.5;font-size:.94rem;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#00141a;font-weight:500;border-bottom-right-radius:3px}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:3px}
.msg.err{border-color:#7f1d1d;color:#fca5a5}
.meta{font-size:.7rem;color:var(--muted);margin-top:6px}
footer{padding:10px 14px;border-top:1px solid var(--border);background:var(--panel)}
.bar{max-width:900px;margin:0 auto;display:flex;gap:8px}
#prompt{flex:1;padding:11px 13px;font-size:.95rem}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.active{display:flex}
.card{background:var(--panel);border:1px solid var(--border);padding:18px;border-radius:14px;width:100%;max-width:440px;max-height:92dvh;overflow-y:auto;display:flex;flex-direction:column;gap:11px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}

@media(max-width:760px){
  aside{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:.2s;width:78%;max-width:290px}
  aside.open{transform:none}
  aside.open~.scrim{display:block}
  #burger{display:block}
  .msg{max-width:93%}
  .hide-m{display:none}
}
</style>
</head>
<body>

<aside id="drawer">
  <div class="logo">MARVO AI<small>v0.16</small></div>
  <button class="primary" onclick="clearChat()">+ New chat</button>
  <h4>Engines</h4>
  <button class="eng" data-e="gemini">☁️ Gemini Cloud</button>
  <button class="eng" data-e="hf">🤗 Hugging Face</button>
  <button class="eng" data-e="local1">💻 Local LLM 1</button>
  <button class="eng" data-e="local2">🧠 Local LLM 2</button>
  <div class="spacer"></div>
  <div class="stat">Session tokens: <b id="sessTok">0</b><br>Memory: last 4 turns<br>Cap: 512 tokens / reply</div>
  <button onclick="toggleModal()">⚙️ Settings</button>
</aside>
<div class="scrim" onclick="toggleDrawer()"></div>

<div class="main">
  <header>
    <button id="burger" onclick="toggleDrawer()">☰</button>
    <select id="engineSelect" title="AI Engine">
      <option value="gemini">Gemini Cloud</option>
      <option value="hf">Hugging Face</option>
      <option value="local1">Local LLM 1</option>
      <option value="local2">Local LLM 2</option>
    </select>
    <span class="grow"></span>
    <span id="tokenBadge" class="badge">Tokens: 0</span>
    <button onclick="clearChat()" class="hide-m">Clear</button>
    <button onclick="toggleModal()" class="hide-m">⚙️</button>
  </header>

  <main id="chat"></main>

  <footer>
    <form class="bar" onsubmit="sendMessage(event)">
      <button type="button" id="micBtn" onclick="startVoice()" title="Voice input">🎤</button>
      <input id="prompt" type="text" placeholder="Ask Marvo AI..." autocomplete="off" required />
      <button type="submit" class="primary" id="sendBtn">Send</button>
    </form>
  </footer>
</div>

<div class="modal" id="settingsModal">
  <div class="card">
    <h3>Settings</h3>
    <div class="field"><label>Gemini API Key (optional if set on Render)</label>
      <input type="password" id="geminiKey" placeholder="AIza..." autocomplete="off" /></div>
    <div class="field"><label>Hugging Face Token (optional if set on Render)</label>
      <input type="password" id="hfKey" placeholder="hf_..." autocomplete="off" /></div>
    <div class="field"><label>Hugging Face Model</label>
      <input type="text" id="hfModel" placeholder="Qwen/Qwen2.5-7B-Instruct" /></div>
    <div class="field"><label>Local Ollama URL</label>
      <input type="text" id="localUrl" placeholder="http://127.0.0.1:11434" /></div>
    <div class="field"><label>Local LLM 1 model</label>
      <input type="text" id="model1" placeholder="llama3.2:1b" /></div>
    <div class="field"><label>Local LLM 2 model</label>
      <input type="text" id="model2" placeholder="deepseek-r1:1.5b" /></div>
    <div class="field">Local models run in your browser's machine. If blocked, start Ollama with OLLAMA_ORIGINS="*".</div>
    <div class="row">
      <button onclick="toggleModal()">Close</button>
      <button class="primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const chatEl = $('chat'), promptEl = $('prompt'), engineSel = $('engineSelect');
const MAX_MSGS = 8, COOLDOWN = 4000; // 4s ≈ 15 RPM
let history = [], lastReq = 0, sessTokens = 0, busy = false;

const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};
const cfg = {
  geminiKey: store.get('marvo_gkey', ''),
  hfKey: store.get('marvo_hfkey', ''),
  hfModel: store.get('marvo_hfmodel', 'Qwen/Qwen2.5-7B-Instruct'),
  localUrl: store.get('marvo_url', 'http://127.0.0.1:11434'),
  model1: store.get('marvo_m1', 'llama3.2:1b'),
  model2: store.get('marvo_m2', 'deepseek-r1:1.5b')
};

function loadFields() {
  $('geminiKey').value = cfg.geminiKey; $('hfKey').value = cfg.hfKey;
  $('hfModel').value = cfg.hfModel; $('localUrl').value = cfg.localUrl;
  $('model1').value = cfg.model1; $('model2').value = cfg.model2;
}
function toggleModal() { $('settingsModal').classList.toggle('active'); }
function toggleDrawer() { $('drawer').classList.toggle('open'); }
function saveSettings() {
  cfg.geminiKey = $('geminiKey').value.trim();
  cfg.hfKey = $('hfKey').value.trim();
  cfg.hfModel = $('hfModel').value.trim() || 'Qwen/Qwen2.5-7B-Instruct';
  cfg.localUrl = $('localUrl').value.trim().replace(/\/$/, '') || 'http://127.0.0.1:11434';
  cfg.model1 = $('model1').value.trim() || 'llama3.2:1b';
  cfg.model2 = $('model2').value.trim() || 'deepseek-r1:1.5b';
  store.set('marvo_gkey', cfg.geminiKey); store.set('marvo_hfkey', cfg.hfKey);
  store.set('marvo_hfmodel', cfg.hfModel); store.set('marvo_url', cfg.localUrl);
  store.set('marvo_m1', cfg.model1); store.set('marvo_m2', cfg.model2);
  toggleModal();
}

function setEngine(e) {
  engineSel.value = e; store.set('marvo_engine', e);
  document.querySelectorAll('.eng').forEach(b => b.classList.toggle('on', b.dataset.e === e));
  $('drawer').classList.remove('open');
}
document.querySelectorAll('.eng').forEach(b => b.onclick = () => setEngine(b.dataset.e));
engineSelect.onchange = () => setEngine(engineSel.value);

function addMessage(text, role, meta = '', isErr = false) {
  const d = document.createElement('div');
  d.className = `msg ${role}${isErr ? ' err' : ''}`;
  d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  return d;
}
function setTokens(n) {
  sessTokens += n;
  $('tokenBadge').textContent = `Tokens: ${n}`;
  $('sessTok').textContent = sessTokens;
}
function clearChat() {
  history = []; sessTokens = 0;
  chatEl.innerHTML = '';
  addMessage('Marvo AI v0.16 ready. Pick an engine and ask anything. Token-saver is on (4-turn memory).', 'bot');
  $('tokenBadge').textContent = 'Tokens: 0'; $('sessTok').textContent = '0';
  $('drawer').classList.remove('open');
}
function remember(u, a) {
  history.push({ role: 'user', content: u }, { role: 'assistant', content: a });
  history = history.slice(-MAX_MSGS);
}

async function askLocal(model, text) {
  const msgs = [
    { role: 'system', content: 'You are Marvo AI v0.16. Be concise, direct and helpful.' },
    ...history.slice(-MAX_MSGS).map(m => ({ role: m.role, content: m.content.slice(0, 1200) })),
    { role: 'user', content: text }
  ];
  const r = await fetch(`${cfg.localUrl}/api/chat`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model, messages: msgs, stream: false, options: { num_predict: 512 } })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `Local LLM error (${r.status})`);
  let reply = d.message?.content || 'No output from local model.';
  reply = reply.replace(/<think>[\s\S]*?<\/think>/g, '').trim() || reply;
  return { reply, tokens: (d.prompt_eval_count || 0) + (d.eval_count || 0), label: `Local: ${model}` };
}

async function askCloud(engine, text) {
  const r = await fetch('/api/chat', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      engine, message: text, history: history.slice(-MAX_MSGS),
      geminiKey: cfg.geminiKey, hfKey: cfg.hfKey, hfModel: cfg.hfModel
    })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `Cloud error (${r.status})`);
  return { reply: d.reply, tokens: d.usedTokens, label: `Engine: ${d.model}` };
}

async function sendMessage(e) {
  e.preventDefault();
  if (busy) return;
  const text = promptEl.value.trim();
  if (!text) return;
  const now = Date.now();
  if (now - lastReq < COOLDOWN) {
    addMessage(`Cooldown: wait ${Math.ceil((COOLDOWN - (now - lastReq)) / 1000)}s (protects free limits).`, 'bot');
    return;
  }
  lastReq = now; busy = true; $('sendBtn').disabled = true;
  promptEl.value = '';
  addMessage(text, 'user');
  const loading = addMessage('Thinking...', 'bot');
  const engine = engineSel.value;

  try {
    let out;
    if (engine === 'local1') out = await askLocal(cfg.model1, text);
    else if (engine === 'local2') out = await askLocal(cfg.model2, text);
    else out = await askCloud(engine, text);
    loading.remove();
    addMessage(out.reply, 'bot', `${out.label} | Tokens: ${out.tokens}`);
    setTokens(out.tokens);
    remember(text, out.reply);
  } catch (err) {
    loading.remove();
    const local = engine.startsWith('local');
    addMessage(`Error: ${err.message}${local ? '\nIs Ollama running and OLLAMA_ORIGINS="*" set?' : ''}`, 'bot', '', true);
  } finally {
    busy = false; $('sendBtn').disabled = false; promptEl.focus();
  }
}

function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return alert('Voice input is not supported in this browser.');
  const rec = new SR();
  rec.lang = 'en-IN';
  rec.onstart = () => $('micBtn').textContent = '🔴';
  rec.onend = () => $('micBtn').textContent = '🎤';
  rec.onresult = ev => { promptEl.value = ev.results[0][0].transcript; promptEl.focus(); };
  rec.onerror = () => $('micBtn').textContent = '🎤';
  rec.start();
}

loadFields();
setEngine(store.get('marvo_engine', 'gemini'));
clearChat();
</script>
</body>
</html>
